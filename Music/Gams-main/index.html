<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gams</title>
    <link rel="icon" type="image/x-icon" href="img/gams-g.png">
    <link rel="stylesheet" href="assets/new.min.css">
    <style>
        body, html { transition: .5s; margin: 0; padding: 0; }
        @font-face { font-family: facon; src: url('assets/facon.ttf') format('truetype'); }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: #fff; transition: .4s; }
        input:checked + .slider { background-color: #2196f3; }
        input:checked + .slider:before { transform: translateX(26px); }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        .title { font-size: 50pt; font-family: facon, sans-serif; letter-spacing: 3pt; text-align: center; }
        .tile { color: var(--nc-tx-1); height: auto; width: auto; border-radius: 10px; border: 1px solid var(--nc-tx-1); text-align: center; float: left; margin: 20px; text-decoration: none; }
        .tile img { width: 200px; height: 200px; border-radius: 10px; display: block; }
        .tile:hover { font-weight: 700; cursor: pointer; background: var(--nc-bg-3); }
        .shade { opacity: .7; background-color: var(--nc-bg-3); position: fixed; width: 100%; height: 100vh; top: 0; left: 0; z-index: 100; display: block; }
        .cont { opacity: 1; color: var(--nc-tx-1); background-color: var(--nc-bg-3); z-index: 1000; width: calc(100vw - 70px); height: calc(100vh - 70px); border-radius: 10px; text-align: center; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .loader { position: fixed; border: 16px solid var(--nc-bg-3); border-radius: 50%; border-top: 16px solid var(--nc-lk-2); width: 120px; height: 120px; top: 20px; right: 20px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body onload="setSavedTheme()">
    <header><h1 class="title">Gams</h1></header>
    
    <div style="padding: 20px;">
        <label>Dark Mode:</label>
        <label class="switch">
            <input id="darkModeInput" type="checkbox" checked oninput="changeTheme(this)">
            <span class="slider round"></span>
        </label>
        <br><br>
        <p>Total Games: <span id="totalGames">Loading...</span></p>
        <label>Open Gam Mode:</label>
        <select onchange="changeGamMode(this)" id="gamMode">
            <option value="gam">In new tab</option>
            <option value="embed">On this tab</option>
            <option value="blank">In an about:blank tab</option>
            <option value="direct">Replace this tab</option>
            <option value="raw">Raw link in new tab</option>
        </select>
    </div>

    <div class="overlay" id="overlay" style="display:none">
        <div class="shade" id="shade"></div>
        <div class="cont" id="cont">
            <a style="position:fixed; top:-35px; left:-35px" id="newWin" title="Open in new window" target="_blank">
                <button>🡽</button>
            </a>
            <iframe style="width:100%; height:100%; border-radius:10px" frameborder="0" id="mainGam"></iframe>
            <div class="loader" id="loader"></div>
        </div>
    </div>

    <div id="contain">
        <a href="Settings.html" class="tile"><img class="img" src="img/gams-g.png"><p class="name">Settings</p></a>
        <a href="g/about.html" class="tile"><img class="img" src="img/gams-g.png"><p class="name">About</p></a>
    </div>

    <div id="searcher">
        <div onclick="searchbar(this)" style="position:fixed; width:50px; right:10px; top:10px; z-index:100; cursor:pointer;">
            <svg style="fill:var(--nc-tx-2)" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
        </div>
    </div>

    <script>
        const BroadcastDisguise = new BroadcastChannel("BroadcastDisguise");
        function l(e) { return document.getElementById(e); }

        function setLight() {
            const r = document.documentElement.style;
            r.setProperty("--nc-tx-1","#000000"); r.setProperty("--nc-tx-2","#1A1A1A");
            r.setProperty("--nc-bg-1","#FFFFFF"); r.setProperty("--nc-bg-2","#F6F8FA");
            r.setProperty("--nc-bg-3","#E5E7EB"); r.setProperty("--nc-lk-1","#0070F3");
            r.setProperty("--nc-lk-2","#0366D6"); r.setProperty("--nc-ac-1","#79FFE1");
        }

        function setDark() {
            const r = document.documentElement.style;
            r.setProperty("--nc-tx-1","#ffffff"); r.setProperty("--nc-tx-2","#eeeeee");
            r.setProperty("--nc-bg-1","#000000"); r.setProperty("--nc-bg-2","#111111");
            r.setProperty("--nc-bg-3","#222222"); r.setProperty("--nc-lk-1","#3291FF");
            r.setProperty("--nc-lk-2","#0070F3"); r.setProperty("--nc-ac-1","#7928CA");
        }

        // Search and Theme functions (kept from your original logic)
        function searchbar(e){ e.remove(); l("searcher").innerHTML+='<input id="searchQuery" type="search" onkeyup="startSearch()" placeholder="Search..." autocomplete="off" style="position:fixed; width: 120px; right: 10px; top: 10px; z-index: 100; font-size:13pt;" onblur="searchicon(this)">'; l("searchQuery").focus(); }
        function searchicon(e){ setTimeout(() => { e.remove(); l("searcher").innerHTML='<div onclick="searchbar(this)" style="position:fixed; width: 50px; right: 10px; top: 10px; z-index: 100; cursor:pointer;"><svg style="fill:var(--nc-tx-2)" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg></div>'; }, 500); }
        
        function storeJSON(e,t){ let n = JSON.parse(localStorage.getItem(e) || "{}"); n[t.key] = t.value; localStorage.setItem(e, JSON.stringify(n)); return n; }
        function getStoredJSON(e,t){ let n = JSON.parse(localStorage.getItem(e) || "{}"); return t ? n[t.key] : n; }

        function changeTheme(e){ e.checked ? (setDark(), storeJSON("gams",{key:"theme",value:"dark"})) : (setLight(), storeJSON("gams",{key:"theme",value:"light"})); }
        function changeGamMode(e){ storeJSON("gams",{key:"gamMode",value:e.value}); }
        
        function setSavedTheme(){
            let settings = getStoredJSON("gams");
            if(settings.gamMode) l("gamMode").value = settings.gamMode;
            if(settings.theme === "light") { setLight(); l("darkModeInput").checked = false; }
            else { setDark(); l("darkModeInput").checked = true; }
        }

        function startSearch(){
            let q = l("searchQuery").value.toUpperCase();
            let tiles = document.getElementsByClassName("tile");
            for(let t of tiles) { t.style.display = t.textContent.toUpperCase().includes(q) ? "" : "none"; }
        }

        // Game Data & Generation
        const gamsList = [
            {title:"Basic", type:"section"},
            {name:"Stickman Hook"},
            {name:"Drive Mad", href:"g/g/drivemad/drivemad.html"},
            {name:"2048"},
            {name:"Cookie Clicker", href:"g/g/cookie/index.html"},
            {name:"Cube Field", href:"g/g/cubefield/index.html"},
            {name:"Spacebar Clicker"},
            {name:"Offline Paradise"},
            {name:"Geometry Dash"},
            {title:"Retrogaming", type:"section"},
            {name:"Super Mario 64"},
            {name:"Celeste"},
            {title:"Flash", type:"section"},
            {name:"Raft Wars"},
            {name:"Worlds Hardest Game"},
            {name:"Ruffle Flash Player", href:"g/g/Ruffle/Ruffle.html"}
        ];

        let container = l("contain");
        gamsList.forEach(item => {
            if(item.type === "section") {
                let h2 = document.createElement("h2");
                h2.style.width = "100%"; h2.style.float = "left"; h2.innerText = item.title;
                container.appendChild(h2);
            } else {
                let nameId = item.name.toLowerCase().replace(/\s/g,"");
                let tile = document.createElement("div");
                tile.className = "tile";
                tile.innerHTML = `<img src="img/${nameId}.png" onerror="this.src='img/gams-g.png'"><p class="name">${item.name}</p>`;
                
                let href = item.href || `g/${nameId}.html`;
                tile.onclick = () => {
                    let mode = getStoredJSON("gams").gamMode || "gam";
                    if(mode === "gam") window.open(`g/g/Gam.html?src=${href}`);
                    else if(mode === "embed") { l("overlay").style.display="block"; l("mainGam").src=href; }
                    else window.location.href = href;
                };
                container.appendChild(tile);
            }
        });

        l("shade").onclick = () => { l("overlay").style.display="none"; l("mainGam").src=""; };
        l("totalGames").innerText = gamsList.filter(g => g.name).length;
    </script>
</body>
</html>
